templateVersion: 1
templateId: within-subjects-crossover-v2
title: Within-subjects crossover
description: Compare AI-assisted and unassisted work within each developer using matched tasks
  and counterbalanced order. This capture adaptation uses time to first passing test and a declared
  workload survey; it does not reproduce METR’s per-issue randomisation.
designType: rct-within-subjects
designSignature:
- crossover
- cross-over
- counterbalanced
- order effect
dataPath: live
source:
- paperRef: arxiv:2507.09089
  role: comparison-reference; capture and allocation adapted
parameters:
  studyId:
    type: string
    default: within-subjects-crossover-v2-study
  title:
    type: string
    default: Within-subjects crossover
  researchQuestion:
    type: string
    default: Does AI assistance affect objective task time compared to unassisted work?
  conditions:
    type: conditions
    default:
    - unassisted
    - ai-assisted
  participantPlan:
    type: participants
    min: 4
    default: 34
    rationale: Assumed two-sided t-test planning at d_z=0.5 (difference SD), alpha=0.05, power=0.8;
      not an observed effect or a sample copied from a paper.
  sessionMinutes:
    type: int
    default: 45
    min: 15
    max: 120
  taskDescription:
    type: string
    default: Development tasks completed under both conditions, counterbalanced. Counterbalanced
      capture adaptation; pilot matched tasks, and document allocation. This is not METR per-issue
      randomisation.
  researchers:
    type: conditions
    default:
    - Researcher
  ethicsRef:
    type: string
    default: 'pending: not yet obtained'
  outputEndpoint:
    type: string
    default: http://127.0.0.1:8000/ingest/events
measures:
- id: first-green-time
  leg: behavioral
  elements:
  - task_outcome.firstGreenMs
  description: Captured first-green milestone, not self-reported total active issue time.
- id: workload
  leg: cognitive
  elements:
  - survey_response.score
  description: Declared raw TLX mean (adapted, five subscales).
- id: ai-use-report
  leg: cognitive
  elements:
  - survey_response.responses.ai_use
  description: Self-reported AI use, asked in every condition; a manipulation check, not
    verified use.
statisticalPlan:
  unit: participant
  perRQ:
  - rq: RQ-1
    outcome: First-green timing; paired
    test: t-test-paired
    effectSize: cohen-d
    smallN: hypothesis-generating
  - rq: RQ-2
    outcome: Declared workload score
    test: wilcoxon-signed-rank
    effectSize: matched-pairs rank-biserial
    smallN: hypothesis-generating
threats:
- threat: allocation-and-timing-adaptation
  mitigation: Document randomisation separately and distinguish first-green timing from total
    active task time.
- threat: task-materials
  mitigation: Pilot and version actual task materials before recruitment.
protocolSkeleton:
  protocolVersion: 6
  study:
    id: '{{ studyId }}'
    title: '{{ title }}'
    researchers: '{{ researchers }}'
    ethicsRef: '{{ ethicsRef }}'
  researchQuestions:
  - id: RQ-1
    text: '{{ researchQuestion }}'
  - id: RQ-2
    text: How does reported workload differ between conditions?
  conditions: '{{ conditions }}'
  participants:
    planned: '{{ participantPlan }}'
    design: within-subjects
    counterbalanced: true
  session:
    durationMinutes: '{{ sessionMinutes }}'
    taskDescription: '{{ taskDescription }}'
  instruments:
    tern:
      session:
        durationMinutes: '{{ sessionMinutes }}'
      fatigue:
        intervalMinutes: 15
        waitForPauseSeconds: 4
        jitterPercent: 20
        quietTailMinutes: 5
      stuck:
        enabled: true
        thresholdSeconds: 90
        cooldownMinutes: 5
        languages:
        - python
      output:
        httpEndpoint: '{{ outputEndpoint }}'
    taskHarness:
      enabled: true
    surveys:
    - id: raw-tlx
      version: '1.0'
      title: Task workload
      timing: post-task
      instructions: Rate the task you just finished.
      items:
      - id: mental_demand
        text: How much mental and perceptual activity was required?
        scale:
          min: 0
          max: 100
          step: 10
          lowLabel: Low
          highLabel: High
        reverse: false
      - id: temporal_demand
        text: How much time pressure did you feel?
        scale:
          min: 0
          max: 100
          step: 10
          lowLabel: Low
          highLabel: High
        reverse: false
      - id: performance
        text: How successful do you think you were in accomplishing the goals of the task?
        scale:
          min: 0
          max: 100
          step: 10
          lowLabel: Poor
          highLabel: Good
        reverse: true
      - id: effort
        text: How hard did you have to work to accomplish your level of performance?
        scale:
          min: 0
          max: 100
          step: 10
          lowLabel: Low
          highLabel: High
        reverse: false
      - id: frustration
        text: How insecure, discouraged, irritated, stressed and annoyed did you feel during the task?
        scale:
          min: 0
          max: 100
          step: 10
          lowLabel: Low
          highLabel: High
        reverse: false
      scoring: mean
      source: https://ntrs.nasa.gov/citations/20000021488
      licence: US government work; NASA permits use and modification without permission
      validation: 'Adapted raw TLX: five of the six NASA v1.0 subscales (physical demand dropped for
        desk tasks), each question the first sentence of NASA''s definition, rated 0–100 in steps
        of 10 (11 points; the paper form has 21). Performance runs Poor → Good and is reverse-scored,
        so the score is the unweighted mean with higher meaning more workload. Report it as an adapted
        raw TLX, not the weighted NASA-TLX.'
    - id: session-check
      version: '1.0'
      title: About this session
      timing: post-task
      instructions: There are no right answers. Please answer honestly.
      items:
      - id: ai_use
        text: How much did you use AI tools during the task (chat, code completion or agents, inside
          or outside the editor)?
        scale:
          min: 0
          max: 4
          step: 1
          lowLabel: Not at all
          highLabel: Throughout the task
        reverse: false
      - id: comprehension
        text: How well do you understand the code you ended up with?
        scale:
          min: 1
          max: 5
          step: 1
          lowLabel: Not at all
          highLabel: Completely
        reverse: false
      scoring: none
      source: StudyLoop item set, 2026-11-23
      licence: Repository MIT licence
      validation: 'Unvalidated single items, analysed separately. ai_use is asked in every condition:
        above 0 is reported AI use, and 0 is a self-report, not verified non-use. Interpret responses in
        the context of the study protocol and analyse by assigned condition.
        comprehension is a self-rating, not a comprehension test.'
  phases:
  - name: design
    gates:
    - protocol-validated.txt
  - name: ethics
    gates:
    - ethics-approval.pdf
  - name: pilot
    gates: []
  - name: recruitment
    gates: []
  - name: data-collection
    gates: []
  - name: analysis
    gates: []
  - name: write-up
    gates: []
  analysisPlan:
  - rq: RQ-1
    recipes:
    - mean-comparison
  - rq: RQ-2
    recipes:
    - typed-measures
  tasks:
  - id: task-a
    title: Coding task A
    description: Define and pilot task materials before recruitment.
    version: '1.0'
  - id: task-b
    title: Coding task B
    description: Define matched materials for the second condition before recruitment.
    version: '1.0'
  measureSetVersion: '1.0'
  measures:
  - id: first-green-time
    construct: Time to first passing test
    instrument: taskHarness
    fields:
    - task_outcome.firstGreenMs
    analysisRecipe: mean-comparison
    version: '1.0'
  - id: workload
    construct: Raw TLX workload
    instrument: raw-tlx
    fields:
    - survey_response.score
    analysisRecipe: typed-measures
    version: '1.0'
  - id: ai-use-report
    construct: Self-reported AI use (manipulation check)
    instrument: session-check
    fields:
    - survey_response.responses.ai_use
    analysisRecipe: typed-measures
    version: '1.0'
  controlConditions:
  - unassisted
  literature:
  - paperRef: arxiv:2507.09089
    justifies:
    - RQ-1
