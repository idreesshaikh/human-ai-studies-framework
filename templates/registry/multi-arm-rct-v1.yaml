templateVersion: 1
templateId: multi-arm-rct-v1
title: Multi-arm RCT
description: |
  Three or more independent groups compared simultaneously. Each participant
  is randomly assigned to one condition. Prescribes Kruskal-Wallis H with
  Cliff's delta for pairwise follow-ups and Holm correction.
designType: rct-between-subjects
dataPath: live
source:
  - paperRef: corpus:guidelines-empirical-llm-se
    role: primary-design
parameters:
  studyId:
    type: string
    default: multi-arm-rct-study
  title:
    type: string
    default: "Multi-arm randomised controlled trial"
  conditions:
    type: conditions
    default: [control, treatment-A, treatment-B]
  participantPlan:
    type: participants
    min: 9
    default: 30
    rationale: Minimum 3 per arm for exact distribution
  sessionMinutes:
    type: int
    default: 60
    min: 15
    max: 180
  taskDescription:
    type: string
    default: Development task completed under assigned condition
  researchers:
    type: conditions
    default: [Researcher]
  ethicsRef:
    type: string
    default: "ethics application (in preparation; gate blocks data-collection)"
  outputEndpoint:
    type: string
    default: "http://127.0.0.1:8000/ingest/events"
measures:
  - id: primary-outcome
    leg: behavioral
    elements: [task_outcome]
    description: Primary outcome measure across all arms
statisticalPlan:
  unit: participant
  perRQ:
    - rq: RQ-1
      outcome: primary measure (3+ groups)
      test: kruskal-wallis
      effectSize: cliffs-delta
      smallN: hypothesis-generating
      multipleComparison: holm
threats:
  - threat: multiple-comparisons
    mitigation: Holm-Bonferroni correction for post-hoc pairwise tests
  - threat: unequal-n
    mitigation: Kruskal-Wallis is robust to modest cell-size differences
protocolSkeleton:
  protocolVersion: 4
  study:
    id: "{{ studyId }}"
    title: "{{ title }}"
    researchers: "{{ researchers }}"
    ethicsRef: "{{ ethicsRef }}"
  researchQuestions:
    - id: RQ-1
      text: How do the treatments compare to each other and to control?
  conditions: "{{ conditions }}"
  participants:
    planned: "{{ participantPlan }}"
    design: between-subjects
    counterbalanced: false
  session:
    durationMinutes: "{{ sessionMinutes }}"
    taskDescription: "{{ taskDescription }}"
  instruments:
    tern:
      session:
        durationMinutes: "{{ sessionMinutes }}"
      fatigue:
        intervalMinutes: 15
        waitForPauseSeconds: 4
        jitterPercent: 20
        quietTailMinutes: 5
      stuck:
        enabled: true
        thresholdSeconds: 90
        cooldownMinutes: 5
        languages: [python]
      output:
        httpEndpoint: "{{ outputEndpoint }}"
    metrics:
      metricSet: cognitive-load-9
  phases:
    - name: design
      gates:
        - protocol-validated.txt
    - name: ethics
      gates:
        - ethics-approval.pdf
    - name: pilot
      gates: []
    - name: recruitment
      gates: []
    - name: data-collection
      gates: []
    - name: analysis
      gates: []
    - name: write-up
      gates: []
  analysisPlan:
    - rq: RQ-1
      recipes: [two-group-nonparametric]
