templateVersion: 1

# Ziegler Telemetry + Survey Template
# Encodes the Ziegler et al. design (arxiv:2205.06537)
# Joins telemetry data with self-report survey data
templateId: ziegler-telemetry-survey-v1

title: Captured AI code-completion use and self-report

description: |
  Combines captured inline-suggestion accept counts with self-report survey
  data. TERN cannot reliably observe displayed suggestions, so it does not
  estimate acceptance rates or review latency. Captured accepts are a lower
  bound on AI use and do not verify that a no-AI condition stayed clean.

source:
  - paperRef: arxiv:2205.06537
    role: primary-design
  - paperRef: corpus:copilot-productivity-ziegler
    role: primary-design

# Stol & Fitzgerald ABC: lab experiment with controlled tasks
designType: lab-experiment

designSignature:
  - "telemetry"
  - "usage logs"
  - "instrumented"
  - "accepted completion counts"
  - "self-reported productivity"

# This template supports live instrumentation (telemetry + survey)
dataPath: live

parameters:
  taskCount:
    type: int
    default: 10
    min: 5
    description: Number of coding tasks per participant
    rationale: Provides repeated tasks for comparing captured accept counts

  sessionMinutes:
    type: int
    default: 60
    min: 45
    max: 90
    description: Total session duration
    rationale: Allows for multiple code completion opportunities

  completionThreshold:
    type: int
    default: 5
    min: 3
    description: Minimum number of completed tasks for inclusion
    rationale: Ensures enough completed tasks for descriptive telemetry

  conditions:
    type: conditions
    default: [with-completion, without-completion]
    description: Experimental arms (tool availability)
    rationale: Within-subjects comparison of completion vs no completion

  participantPlan:
    type: participants
    min: 10
    default: 20
    description: Target number of participants
    rationale: Achieves power for medium effect sizes

  # Per-instantiation study identity + fill values (all defaulted so the
  # template instantiates with no input; a researcher overrides what they want).
  studyId:
    type: string
    default: ziegler-telemetry-study
    description: Stable study id
  title:
    type: string
    default: "Telemetry + self-report join for AI code completion"
    description: Study title
  researchers:
    type: conditions
    default: [Researcher]
    description: The research team
  ethicsRef:
    type: string
    default: "pending: not yet obtained"
    description: Ethics reference
  taskDescription:
    type: string
    default: "Complete the coding tasks; accept or reject each AI completion."
    description: Extra task detail
  outputEndpoint:
    type: string
    default: "http://127.0.0.1:8000/ingest/events"
    description: The instrument's ingestion endpoint

measures:
  - id: captured-accept-count
    leg: behavioral
    elements: [completion_accepted]
    description: Count of captured inline-suggestion accept keybindings
    caution: Lower bound on use; no reliable displayed-suggestion denominator
    cite: arxiv:2205.06537

  - id: captured-dismiss-count
    leg: behavioral
    elements: [completion_dismissed]
    description: Count of captured inline-suggestion dismiss keybindings
    caution: Does not count all rejected or ignored suggestions
    cite: arxiv:2205.06537

  - id: self-report-productivity
    leg: cognitive
    elements: [post-session survey]
    description: Subjective productivity assessment
    caution: Self-report may diverge from objective measures

instruments:
  tern:
    session:
      durationMinutes: "{{ sessionMinutes }}"
    fatigue:
      intervalMinutes: 20
      waitForPauseSeconds: 3
    stuck:
      enabled: true
      thresholdSeconds: 60
    output:
      httpEndpoint: "{{ outputEndpoint }}"
  metrics:
    metricSet: code-quality-5

statisticalPlan:
  unit: participant

  perRQ:
    - rq: primary
      outcome: captured-accept-count (count, paired)
      test: wilcoxon-signed-rank
      effectSize: matched-pairs rank-biserial
      aggregationUnit: per-participant
      smallN: hypothesis-generating
      multipleComparison: bonferroni

    - rq: correlation
      outcome: captured-accept-count (lower-bound count) vs self-report-productivity (ordinal)
      test: spearman
      effectSize: spearman-rho
      aggregationUnit: per-participant
      smallN: hypothesis-generating

threats:
  - threat: demand-characteristics
    mitigation: Participants unaware that captured accept counts are being summarized
    cite: guidelines-empirical-llm-se

  - threat: social-desirability-bias
    mitigation: Anonymized responses and neutral framing
    cite: guidelines-empirical-llm-se

protocolSkeleton:
  protocolVersion: 4

  study:
    id: "{{ studyId }}"
    title: "{{ title }}"
    researchers: "{{ researchers }}"
    ethicsRef: "{{ ethicsRef }}"

  researchQuestions:
    - id: RQ-1
      text: "How many inline-suggestion accept actions does TERN capture under each tool-availability condition?"
    - id: RQ-2
      text: "How are captured accept counts associated with self-reported productivity?"
    - id: RQ-3
      text: "What AI use do participants report that TERN did not capture?"

  conditions: "{{ conditions }}"

  participants:
    planned: "{{ participantPlan }}"
    design: within-subjects
    counterbalanced: true

  session:
    durationMinutes: "{{ sessionMinutes }}"
    taskDescription: |
      Participants complete {{ taskCount }} coding tasks. The assigned AI assistant
      may provide code-completion suggestions. TERN records accept and dismiss
      keybindings but cannot observe every displayed suggestion or AI-use surface.
      {{ taskDescription }}

  instruments:
    tern:
      session:
        durationMinutes: "{{ sessionMinutes }}"
      fatigue:
        intervalMinutes: 20
        waitForPauseSeconds: 3
      stuck:
        enabled: true
        thresholdSeconds: 60
      output:
        httpEndpoint: "{{ outputEndpoint }}"
    metrics:
      metricSet: code-quality-5

  phases:
    - name: design
      gates:
        - protocol-validated.txt
    - name: ethics
      gates:
        - ethics-approval.pdf
    - name: pilot
      gates: []
    - name: recruitment
      gates: []
    - name: data-collection
      gates: []
    - name: analysis
      gates: []
    - name: write-up
      gates: []

  analysisPlan:
    - rq: RQ-1
      recipes: [ziegler-acceptance-rate]
    - rq: RQ-2
      recipes: [ai-review-behavior]
    - rq: RQ-3
      recipes: [task-outcome-by-condition]

  literature:
    - paperRef: arxiv:2205.06537
      justifies: [RQ-1, RQ-2, RQ-3]
