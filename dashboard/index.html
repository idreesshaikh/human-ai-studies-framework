<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Mission Control</title>
    <script>
      // Pre-paint theme stamp (mirrors src/lib/theme.svelte.ts) so a saved
      // or OS-dark theme never flashes light on load.
      try {
        var mode = localStorage.getItem('dashboard.theme') || 'system'
        var dark =
          mode === 'dark' ||
          (mode !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        /* default to light */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
