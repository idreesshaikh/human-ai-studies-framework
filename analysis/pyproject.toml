[project]
name = "analysis"
version = "0.1.0"
description = "Recipe-based analysis, per-RQ report, paper draft export (FR-ANA-*)"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "protocol",
    "scipy>=1.18.0",
]

[project.scripts]
analysis = "analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
protocol = { workspace = true }
