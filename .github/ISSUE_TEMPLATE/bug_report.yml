name: Bug report
description: Something behaves incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        **Before you start:** if this involves participant data leaking, an
        auth bypass, or the design conversation receiving participant row-level data, stop
        and report it privately instead — see
        [security policy](https://github.com/idreesshaikh/human-ai-studies-framework/blob/main/docs/security.md).


        **Never paste real participant data into this form**, even redacted.
        Reproduce with synthetic data.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - platform (web workspace)
        - middleware (API, storage)
        - protocol
        - extension (TERN)
        - analysis
        - agent-capture
        - metrics
        - templates
        - docs
        - build, CI, or deployment
        - other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that confirm the fix.
      placeholder: |
        - ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: >-
        The smallest sequence that shows it. A failing test is the ideal
        report. Include the exact command you ran and its output.
      placeholder: |
        1. uv run protocol validate protocol/examples/...
        2. ...
        Output:
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or a release tag.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        OS, Python version, Node version, and whether you are on PostgreSQL
        (the default) or the SQLite fallback. For extension reports, your
        VS Code version.
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This contains no real participant data.
          required: true
        - label: >-
            This is not a security or privacy vulnerability (those go through
            the security policy).
          required: true
