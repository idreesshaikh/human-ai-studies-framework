name: Feature request
description: Propose a capability the platform should have.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        **Scope:** PHOENIX supports task-based studies of human-AI software
        development: study design, participant capture, and analysis handoff
        through an explicit protocol. The feature set is frozen for this
        release, so new product surfaces are out of scope; fixes, security,
        accessibility, reproducibility, and documentation improvements are
        welcome. See
        [docs/scope.md](https://github.com/idreesshaikh/human-ai-studies-framework/blob/main/docs/scope.md).

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What can a researcher not do today? Describe the research task, not a
        proposed UI. Concrete beats general.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The capability, and how you would know it worked.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, testable conditions that define completion.
      placeholder: |
        - ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - platform (web workspace)
        - middleware (API, storage)
        - protocol
        - extension (TERN)
        - analysis
        - agent-capture
        - metrics
        - templates
        - curated (experimental)
        - docs
        - other
    validations:
      required: true

  - type: textarea
    id: fit
    attributes:
      label: Fit with the project scope
      description: >-
        Which part of the supported work does this improve, or which fix,
        security, accessibility, reproducibility, or documentation gap does it
        close? If it widens the scope, say why it should.
      placeholder: "Setup: the participant cannot tell which task they are on."
    validations:
      required: true

  - type: textarea
    id: grounding
    attributes:
      label: Literature grounding (optional but valued)
      description: >-
        If a paper motivates this, cite it. A grounded proposal is far stronger
        than an unsourced one, and may map onto a template.

  - type: textarea
    id: dependencies
    attributes:
      label: New dependencies
      description: >-
        Any new library, tool, or service: name it, say what it replaces, and
        say how the platform should behave when it is unavailable. Everything
        external here degrades gracefully, and a new dependency must too.
      placeholder: None, or the library and why nothing already present will do.
