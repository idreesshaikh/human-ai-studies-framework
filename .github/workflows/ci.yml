name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python - pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install workspace
        run: uv sync --all-packages --frozen

      - name: Lint
        run: uv run ruff check .

      - name: AGENTS.md is not stale (FR-AGF-2 drift gate)
        run: uv run python scripts/generate_agents_md.py --check

      - name: Agent discovery demo runs (FR-AGF-1 F1.2)
        run: uv run python scripts/agent_manifest_demo.py --in-process

      - name: Tests
        run: uv run pytest --cov=metrics/src --cov-report=term-missing --cov-fail-under=95

  extension:
    name: Extension - typecheck + lint + format + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Check (tsc + eslint + prettier + tests)
        run: npm run check

  platform:
    name: Platform - tsc + lint + verify + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install
        run: npm ci

      - name: Check (tsc + lint + verify + build)
        run: npm run check

  docker:
    name: Middleware image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build middleware image
        run: docker build -f middleware/Dockerfile .
