name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python - pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install workspace
        run: uv sync --all-packages --frozen

      - name: Lint
        run: uv run ruff check .


      - name: Workspace and deployment configuration agree
        run: uv run python scripts/check_workspace_config.py

      # `--cov` with no value takes its source list from
      # [tool.coverage.run] in the root pyproject.toml: every package's
      # shipped src/, not one package's. The floor sits just under the
      # measured total so it is a ratchet - raise it as coverage climbs,
      # never lower it to make a red build green.
      - name: Tests + coverage (whole workspace, floor 79%)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=79

      # The static-metrics leg keeps the stricter bar it already met; the
      # workspace floor must never be a licence to let it slip.
      - name: Metrics leg keeps its stricter floor (95%)
        run: uv run coverage report --include='metrics/src/*' --fail-under=95

  extension:
    name: Extension - typecheck + lint + format + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit (no known high-severity advisories)
        run: npm audit --audit-level=high

      - name: Check (tsc + eslint + prettier + tests)
        run: npm run check

  platform:
    name: Platform - tsc + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit (no known high-severity advisories)
        run: npm audit --audit-level=high

      - name: Install uv for the real-backend regression
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install workspace
        run: uv sync --all-packages --frozen

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Check (lint + tsc + build + accessible researcher workflows)
        run: npm run check
        env:
          VITE_API_BASE: ""

  docker:
    name: Middleware image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build middleware image
        run: docker build -f middleware/Dockerfile .
