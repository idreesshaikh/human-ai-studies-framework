name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python - pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install workspace
        run: uv sync --all-packages --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest --cov=metrics/src --cov-report=term-missing --cov-fail-under=95

  extension:
    name: Extension - typecheck + lint + format + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Check (tsc + eslint + prettier + tests)
        run: npm run check

  dashboard:
    name: Dashboard - svelte-check + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Check (svelte-check + tsc + tests)
        run: npm run check

  docker:
    name: Middleware image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build middleware image
        run: docker build -f middleware/Dockerfile .
