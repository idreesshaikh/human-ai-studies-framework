# Continuous deployment of the seeded demo (FR-OPS-1a, D24/D25).
#
# Runs only after the CI workflow finishes green on main: builds the
# container image (middleware + platform, one process - NFR-7), pushes it
# to GHCR, then triggers a Railway deployment via the Railway API so the
# demo instance rebuilds. The demo never runs a red build.
#
# Secrets used (all optional - steps skip cleanly when unset, so the
# pipeline works before any account is provisioned; see RUNBOOK §9):
#   RAILWAY_API_TOKEN      - Railway API token (account settings → tokens)
#   RAILWAY_SERVICE_ID     - the Railway service ID for the demo deployment
#   RAILWAY_ENVIRONMENT_ID - the Railway environment ID (e.g. production)

name: Deploy demo

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-demo
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build image → GHCR → Railway demo
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/middleware"
          SHA="${{ github.event.workflow_run.head_sha }}"
          docker build -f middleware/Dockerfile -t "$IMAGE:main" -t "$IMAGE:sha-$SHA" .
          docker push "$IMAGE:main"
          docker push "$IMAGE:sha-$SHA"

      - name: Trigger Railway demo deploy
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "RAILWAY_API_TOKEN or RAILWAY_SERVICE_ID not set - skipping Railway deploy (RUNBOOK §9)."
            exit 0
          fi
          ENV_PART=""
          if [ -n "$RAILWAY_ENVIRONMENT_ID" ]; then
            ENV_PART=", environmentId: \"$RAILWAY_ENVIRONMENT_ID\""
          fi
          RESPONSE=$(curl -fsS -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { serviceInstanceRedeploy(serviceId: \\\"$RAILWAY_SERVICE_ID\\\"$ENV_PART) }\"}" \
            -w "\n%{http_code}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Railway deploy triggered successfully."
          else
            echo "Railway deploy trigger failed (HTTP $HTTP_CODE). Check token and service ID."
            exit 1
          fi
