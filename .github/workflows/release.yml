# Release pipeline (FR-OPS-2/3, D24/D26/D27).
#
# Push a tag to cut a release:
#   v0.3.0-rc.1  → gates → GHCR image + .vsix → GitHub *pre-release*;
#                  deploys the demo instance only.
#   v0.3.0       → the same, as a full release, PLUS (a) the persistent
#                  facilitator VM behind the `production` environment's
#                  manual approval, and (b) VS Code Marketplace publish
#                  (final tags only - the Marketplace rejects semver
#                  pre-release suffixes, D27).
#
# ci.yml also runs on tag pushes; the verify job here re-runs the gates
# anyway so a release can never outrun a slow CI run.
#
# Secrets (each deploy/publish step skips cleanly when its secret is
# unset; see RUNBOOK §9):
#   RENDER_DEPLOY_HOOK_URL          - demo redeploy
#   PROD_HOST / PROD_USER / PROD_SSH_KEY - facilitator VM (Azure B1s)
#   VSCE_PAT                        - Marketplace personal access token

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Gates (pytest + ruff + extension + dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python gates
        run: |
          uv sync --all-packages --frozen
          uv run ruff check .
          uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            dashboard/package-lock.json

      - name: Extension gate
        working-directory: extension
        run: |
          npm ci
          npm run check

      - name: Dashboard gate
        working-directory: dashboard
        run: |
          npm ci
          npm run check

  build:
    name: Image + .vsix + GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push versioned image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/middleware"
          docker build -f middleware/Dockerfile -t "$IMAGE:${{ github.ref_name }}" .
          docker push "$IMAGE:${{ github.ref_name }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Package extension (.vsix)
        working-directory: extension
        run: |
          npm ci
          npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          FLAGS=""
          case "$TAG" in *-rc.*) FLAGS="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" $FLAGS \
            --notes "Container image: \`ghcr.io/${{ github.repository }}/middleware:$TAG\`

          Extension \`.vsix\` attached (RCs install via \`code --install-extension\`; final versions also publish to the VS Code Marketplace)." \
            extension/*.vsix

  deploy-demo:
    name: Deploy demo (all tags)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render demo deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" -o /dev/null
            echo "Render deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL not set - skipping (RUNBOOK §9)."
          fi

  deploy-production:
    name: Deploy facilitator VM (final tags, approval-gated)
    needs: build
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull released image on the VM and restart
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "$PROD_HOST" ]; then
            echo "PROD_HOST not set - skipping VM deploy (RUNBOOK §9)."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$PROD_USER@$PROD_HOST" \
            "cd ~/human-ai-studies-framework && \
             IMAGE_TAG='${{ github.ref_name }}' docker compose -f deploy/compose.prod.yml pull middleware && \
             IMAGE_TAG='${{ github.ref_name }}' docker compose -f deploy/compose.prod.yml up -d"

  publish-marketplace:
    name: Publish extension (final tags)
    needs: build
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: vsce publish
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set - skipping Marketplace publish (RUNBOOK §9)."
            exit 0
          fi
          npm ci
          npx vsce publish --pat "$VSCE_PAT"
