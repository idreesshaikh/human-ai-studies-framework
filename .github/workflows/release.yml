# Release pipeline (FR-OPS-2).
#
# Push a tag to cut a release:
#   v0.3.0-rc.1  → gates → GHCR image → GitHub pre-release; deploys demo.
#   v0.3.0       → the same, as a full release.
#
# Railway is the sole deployment target. The container image is pushed to
# GHCR and a Railway redeploy is triggered via the Railway API. The extension
# .vsix is attached to the GitHub Release for manual installation.
#
# Secrets (each step skips cleanly when its secret is unset; see RUNBOOK §9):
#   RAILWAY_API_TOKEN      - Railway API token for demo redeploy
#   RAILWAY_SERVICE_ID     - Railway service ID
#   RAILWAY_ENVIRONMENT_ID - Railway environment ID (optional)
#   VSCE_PAT               - VS Code Marketplace publish token (D27; full
#                            releases only - the Marketplace rejects -rc.
#                            pre-release semver, so those tags skip too)

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Gates (pytest + ruff + extension + platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python gates
        run: |
          uv sync --all-packages --frozen
          uv run ruff check .
          uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            platform/package-lock.json

      - name: Extension gate
        working-directory: extension
        run: |
          npm ci
          npm run check

      - name: Platform gate
        working-directory: platform
        run: |
          npm ci
          npm run check

  build:
    name: Image + .vsix + GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push versioned image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/middleware"
          docker build -f middleware/Dockerfile -t "$IMAGE:${{ github.ref_name }}" .
          docker push "$IMAGE:${{ github.ref_name }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Package extension (.vsix)
        working-directory: extension
        run: |
          npm ci
          npm run package

      - name: Publish to VS Code Marketplace
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set - skipping Marketplace publish (RUNBOOK §9, D27)."
            exit 0
          fi
          case "$TAG" in
            *-rc.*)
              echo "Pre-release tag ($TAG) - the Marketplace rejects this semver, skipping publish."
              exit 0
              ;;
          esac
          npx vsce publish -p "$VSCE_PAT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          FLAGS=""
          case "$TAG" in *-rc.*) FLAGS="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" $FLAGS \
            --notes "Container image: \`ghcr.io/${{ github.repository }}/middleware:$TAG\`

          Extension \`.vsix\` attached (install via \`code --install-extension\`)." \
            extension/*.vsix

  deploy-demo:
    name: Deploy demo to Railway (all tags)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway demo deploy
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "RAILWAY_API_TOKEN or RAILWAY_SERVICE_ID not set - skipping Railway deploy (RUNBOOK §9)."
            exit 0
          fi
          ENV_PART=""
          if [ -n "$RAILWAY_ENVIRONMENT_ID" ]; then
            ENV_PART=", environmentId: \"$RAILWAY_ENVIRONMENT_ID\""
          fi
          RESPONSE=$(curl -fsS -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { serviceInstanceRedeploy(serviceId: \\\"$RAILWAY_SERVICE_ID\\\"$ENV_PART) }\"}" \
            -w "\n%{http_code}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Railway deploy triggered successfully."
          else
            echo "Railway deploy trigger failed (HTTP $HTTP_CODE)."
            exit 1
          fi
