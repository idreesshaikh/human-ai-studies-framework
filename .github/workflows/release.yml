name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    name: Gates (pytest + ruff + extension + platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Validate release tag and extension version
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          VERSION="${RELEASE_TAG#v}"
          test "$VERSION" != "$RELEASE_TAG"
          test "$(node -p "require('./extension/package.json').version")" = "$VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Python gates
        run: |
          uv sync --all-packages --frozen
          uv run ruff check .
          uv run python scripts/check_workspace_config.py
          uv run pytest --cov --cov-report=term-missing --cov-fail-under=79
          uv run coverage report --include='metrics/src/*' --fail-under=95

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            platform/package-lock.json

      - name: Extension gate
        working-directory: extension
        run: |
          npm ci
          npm audit --audit-level=high
          npm run check

      - name: Platform gate
        working-directory: platform
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
          npm run check

  build:
    name: Extension package and GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Check extension version matches release tag
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          test "$(node -p "require('./extension/package.json').version")" = "$VERSION"

      - name: Package extension (.vsix)
        working-directory: extension
        run: |
          npm ci
          npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          FLAGS=""
          case "$TAG" in *-rc.*) FLAGS="--prerelease" ;; esac
          NOTES="Extension \`.vsix\` attached (install via \`code --install-extension\`)."
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "$TAG" $FLAGS --notes "$NOTES"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --verify-tag --title "$TAG" $FLAGS --notes "$NOTES"
          fi
          VERSION="${TAG#v}"
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber "extension/tern-$VERSION.vsix"
