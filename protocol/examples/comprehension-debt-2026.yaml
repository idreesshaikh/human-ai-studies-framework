# Comprehension-debt study protocol - the v2 human demonstrator study.
#
# DRAFT v0.1 (2026-07-17, design phase - NOT frozen). This study exists to
# demonstrate what only this platform can measure: the per-chunk join of
# engagement (behavioral leg) -> immediate comprehension (cognitive leg,
# FR-INST-19 probes) -> code cognitive-load profile (metrics leg) -> delayed
# maintenance performance, across two sittings a week apart.
#
# Requirements this draft traces to: FR-PROT-1 (this file), FR-INST-19
# (comprehension probes - NEW, see srs.md), FR-INST-8/9/10 (engagement
# measures), FR-AGENT-1/2 (agent leg), FR-INST-16 (harness ground truth).
# Three recipes in the analysis plan (engagement-depth,
# comprehension-by-engagement, maintenance-transfer) are not yet built;
# `analysis validate` fails loudly on them by design (FR-ANA-2) until they
# land.
#
# Design notes (deviations from pilot-2026, deliberate):
# - Sitting order is FIXED (build -> maintenance), so counterbalanced: false.
#   The maintenance sitting must follow the build sitting; the within-subject
#   contrast is per-chunk (engagement depth, provenance), not session order.
# - The maintenance sitting runs `unassisted` so it measures the
#   participant's own comprehension, never the agent's.

protocolVersion: 1

study:
  id: comprehension-debt-2026
  title: "Accepted, but understood? Engagement with agent output and the comprehension debt it leaves"
  researchers:
    - Idrees Razak
    - Project Supervisor
  ethicsRef: "UoM CS ethics application (amendment to pilot-2026 application; gate blocks data-collection)"

researchQuestions:
  - id: RQ-C1
    text: >-
      How deeply do developers engage with agent-produced code before
      accepting it - review time per changed line, scroll coverage of the
      diff, files opened, edits applied to the agent's output - and how do
      accepted chunks distribute across engagement levels?
  - id: RQ-C2
    text: >-
      How does engagement depth relate to immediate comprehension of the
      accepted chunk (timeboxed predict-output / locate-change probes)?
  - id: RQ-C3
    text: >-
      Does comprehension debt persist? In a maintenance sitting 5-7 days
      later, how do time-to-localize, time-to-fix, and fix success on
      injected defects differ between self-written code, deeply engaged
      agent chunks, and skimmed agent chunks?
  - id: RQ-C4
    text: >-
      Does the cognitive-load profile of an accepted chunk (9-metric
      matrix) moderate the engagement -> comprehension -> maintenance
      chain?

conditions: # glossary: condition, not group/treatment
  - ai-assisted # build sitting: 3-4 tasks with Claude Code
  - unassisted # maintenance sitting: defect fixing on own Session-1 codebase

participants:
  planned: 6
  design: within-subjects
  counterbalanced: false # sitting order fixed by design: build precedes maintenance

session:
  durationMinutes: 60
  taskDescription: >-
    Two sittings per participant, 5-7 days apart. Sitting 1 (build,
    ai-assisted, 60 min): 3-4 small Python tasks completed with Claude Code
    in the integrated terminal; every agent contribution the participant
    accepts is an accepted chunk - engagement is measured passively
    (FR-INST-8/9/10 + visible ranges) and each acceptance triggers a
    timeboxed comprehension probe (FR-INST-19). Sitting 2 (maintenance,
    unassisted, 60 min): the participant receives their own Sitting-1
    workspace with 2-3 injected realistic defects per code province
    (self-written / deeply-engaged agent chunk / skimmed agent chunk,
    assignment recorded in the task kit) and localizes and fixes them
    without AI tooling; the task harness (FR-INST-16) provides fix ground
    truth. Task kit and defect-injection scheme:
    study/comprehension-debt/tasks/ (to be authored; design-phase gate).

instruments:
  # Nested keys mirror the real cognitiveOverlay.* VS Code settings -
  # `protocol derive overlay-settings` flattens this subtree verbatim.
  cognitiveOverlay:
    session:
      durationMinutes: 60
    fatigue:
      intervalMinutes: 15
      waitForPauseSeconds: 4
      jitterPercent: 20
      quietTailMinutes: 5
    stuck:
      enabled: true
      thresholdSeconds: 90
      cooldownMinutes: 5
      languages: [python]
    output:
      httpEndpoint: "http://127.0.0.1:8000/ingest/events"
  metrics:
    metricSet: cognitive-load-9
    # Computed per accepted chunk (chunk reference from FR-INST-19) as well
    # as per file, so RQ-C4 joins chunk profile to chunk outcomes.
  agentCapture:
    adapter: claude-code
    contentPolicy: metadata-only
  # NEW instrument (FR-INST-19): timeboxed comprehension checks, each
  # response carrying the join keys plus the chunk reference that ties it
  # to the edit burst / agent turn that produced the chunk.
  comprehensionProbes:
    trigger: on-chunk-accept # build sitting: probe immediately after acceptance
    timeboxSeconds: 60
    formats: [predict-output, locate-change]
    maintenanceProbes: true # sitting 2: per-defect localization/fix outcomes

phases:
  - name: design
    gates:
      - protocol-validated.txt
      - task-definitions.md
      - probe-item-bank.md
  - name: ethics
    gates:
      - ethics-approval.pdf
      - consent-form.pdf
  - name: pilot
    gates:
      - dry-run-report.md
  - name: recruitment
    gates:
      - participant-schedule.md
  - name: data-collection
    gates:
      - dataset-export.sqlite3
      - integrity-report.md
  - name: analysis
    gates:
      - per-rq-report.md
  - name: write-up
    gates: []

analysisPlan:
  - rq: RQ-C1
    recipes: [ai-review-behavior, agent-interaction-dynamics, engagement-depth]
  - rq: RQ-C2
    recipes: [comprehension-by-engagement]
  - rq: RQ-C3
    recipes: [maintenance-transfer, task-outcome-by-condition]
  - rq: RQ-C4
    recipes: [code-quality-by-condition, comprehension-by-engagement]

literature:
  - paperRef: "arxiv:2603.14225" # Catalan et al., cognitive engagement levels with agent output
    justifies: [RQ-C1, RQ-C2]
  - paperRef: "arxiv:2210.14306" # Mozannar et al., CUPS behavioral state modeling
    justifies: [RQ-C1]
  - paperRef: "https://personal.us.es/amarlop/wp-content/uploads/2026/03/More-Code-Less-Understanding-On-the-Impact-of-AI-Assistants-on-Developers-Productivity-and-Code-Ownership.pdf"
    # Martin-Lopez et al. 2026 - author preprint, no arXiv/DOI yet (see docs/papers/README.md)
    justifies: [RQ-C3]
  - paperRef: "arxiv:2312.10893" # Tankelevitch et al., metacognitive monitoring constructs
    justifies: [RQ-C2]
  - paperRef: "arxiv:2205.06537" # Ziegler et al., telemetry+self-report join method
    justifies: [RQ-C1, RQ-C4]