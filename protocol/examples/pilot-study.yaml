# Illustrative within-subjects protocol; no participant findings or ethics approval.

protocolVersion: 4

study:
  id: pilot-2026
  title: "AI assistance and developer cognitive load: a within-subjects pilot"
  researchers:
    - Example researcher
    - Example collaborator
  ethicsRef: "Illustrative example; obtain required approval before collection."

researchQuestions:
  - id: RQ-P1
    text: >-
      How does AI assistance affect self-reported cognitive load
      (fatigue probes, stuck episodes, TLX debrief)?
  - id: RQ-P2
    text: >-
      How does AI assistance affect the static cognitive-load profile of the
      code produced (9-metric matrix over workspace snapshots)?
  - id: RQ-P3
    text: >-
      How does AI assistance change working behavior - pasting, file
      switching, edit provenance, active vs idle time?
  - id: RQ-P4
    text: >-
      How many inline-suggestion accepts and dismissals are captured, and what
      are the sizes of accepted blocks? These events are lower-bound measures;
      TERN cannot observe all suggestions or AI use.
  - id: RQ-P5
    text: >-
      How does the conversation with the agent unfold over a session - turn
      cadence, tool-call mix, reliance loops - and how does it relate to
      outcomes?

conditions: # glossary: condition, not group/treatment
  - ai-assisted
  - unassisted

participants:
  planned: 6
  design: within-subjects
  counterbalanced: true # condition order alternates per participant

session:
  durationMinutes: 45
  taskDescription: >-
    Two matched Python maintenance tasks (one per condition, order
    counterbalanced with condition pairing per the runbook's Latin square):
    Task A "expenses" and Task B "logbook", each a
    small existing codebase with two seeded defects and one feature request,
    shipped with acceptance tests providing outcome ground truth
    (via the task harness). In ai-assisted sessions the
    participant uses Claude Code in the integrated terminal; in unassisted
    sessions AI tooling is disabled.

instruments:
  # Nested keys mirror the real tern.* VS Code settings -
  # `protocol derive overlay-settings` flattens this subtree verbatim.
  tern:
    session:
      durationMinutes: 45
    fatigue:
      intervalMinutes: 15
      waitForPauseSeconds: 4
      jitterPercent: 20
      quietTailMinutes: 5
    stuck:
      enabled: true
      thresholdSeconds: 90
      cooldownMinutes: 5
      languages: [python]
    output:
      httpEndpoint: "http://127.0.0.1:8000/ingest/events"
    ideHealth:
      enabled: false
      debounceSeconds: 10
    comprehensionProbe:
      enabled: true
      cadence: every-chunk
      sampleRate: 1
      probeTypes:
        - predict-output
        - locate-change
  metrics:
    metricSet: cognitive-load-9
  # Agent leg (declared before the freeze so the consent form matches the
  # content policy by construction). metadata-only: turn/tool-call timings
  # and sizes, never conversation text.
  agentCapture:
    adapter: claude-code
    contentPolicy: metadata-only

phases:
  - name: design
    gates:
      - protocol-validated.txt
      - task-definitions.md
  - name: ethics
    gates:
      - ethics-approval.pdf
      - consent-form.pdf
  - name: pilot
    gates:
      - dry-run-report.md
  - name: recruitment
    gates:
      - participant-schedule.md
  - name: data-collection
    gates:
      - dataset-export.sqlite3
      - integrity-report.md
  - name: analysis
    gates:
      - per-rq-report.md
  - name: write-up
    gates: []

analysisPlan:
  - rq: RQ-P1
    recipes: [fatigue-by-condition, stuck-episodes, tlx-debrief]
  - rq: RQ-P2
    recipes: [code-quality-by-condition]
  - rq: RQ-P3
    recipes: [paste-behavior, meyer-fragmentation]
  - rq: RQ-P4
    recipes: [ai-review-behavior, ziegler-acceptance-rate]
  - rq: RQ-P5
    recipes: [agent-interaction-dynamics, task-outcome-by-condition]

literature:
  - paperRef: "arxiv:2302.06590" # Peng et al., Copilot productivity RCT
    justifies: [RQ-P3, RQ-P4]
  - paperRef: "arxiv:2205.06537" # Ziegler et al., acceptance rate metric
    justifies: [RQ-P4] # paper motivates telemetry; StudyLoop reports captured accept counts only
  - paperRef: "doi:10.1109/TSE.2017.2656886" # Meyer et al., work fragmentation
    justifies: [RQ-P3] # replicated as the meyer-fragmentation recipe
