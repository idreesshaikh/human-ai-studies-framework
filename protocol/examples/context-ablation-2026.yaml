# Context-ablation study protocol - the v2 agent-participant demonstrator.
#
# DRAFT v0.1 (2026-07-17, design phase - NOT frozen), and it DELIBERATELY
# DOES NOT VALIDATE under protocolVersion 1: the v1 schema requires the
# `cognitiveOverlay` instrument, i.e. it assumes a human in an IDE. This
# study has no human participants - the task harness (FR-INST-16) runs an
# agent under test - so no overlay block appears below, and none may be
# faked in to satisfy the validator.
#
# This file is the FIT-CRITERION FIXTURE for FR-PROT-9 (agent participants,
# see srs.md): FR-PROT-9 is satisfied exactly when `protocol validate`
# passes on this file unmodified except for the protocolVersion bump the
# schema change requires. Until then it is a design document, not an
# executable protocol.
#
# Requirements this draft traces to: FR-PROT-9 (NEW - agent-participant
# studies), FR-AGF-2 (the generated-context condition evaluates the
# platform's own agent context files), FR-INST-16 (harness), FR-AGENT-1/2
# (agent leg), FR-CUR-3-style honesty (cost reporting per NFR-8).
# The cost-effectiveness-frontier recipe named below is not yet built;
# `analysis validate` fails loudly on it by design (FR-ANA-2).

protocolVersion: 1 # bump with the FR-PROT-9 schema revision

study:
  id: context-ablation-2026
  title: "Do repo context files help coding agents? A three-condition harness ablation including platform-generated context"
  researchers:
    - Idrees Razak
    - Project Supervisor
  ethicsRef: >-
    Not applicable - no human participants; the agent runs on
    researcher-owned repositories. The ethics phase gate records this
    determination (data-handling-note.md) rather than an approval letter.

researchQuestions:
  - id: RQ-A1
    text: >-
      How do task success (harness pass rates, time-to-first-green) and
      cost (tokens, tool calls, wall time) differ across no-context,
      hand-written-context, and platform-generated-context conditions?
  - id: RQ-A2
    text: >-
      How does the cognitive-load profile of the agent's diffs (9-metric
      matrix) differ across context conditions?
  - id: RQ-A3
    text: >-
      How does the agent's working behavior differ across context
      conditions - tool-call mix, exploration-vs-editing balance, turn
      cadence, dead-end sequences?

conditions:
  - no-context # context files removed from the task workspace
  - hand-written-context # existing CLAUDE.md / AGENTS.md as-is
  - generated-context # FR-AGF-2 files generated from the documents of record

participants:
  # Agent participants (FR-PROT-9): anonymized agent-configuration IDs
  # (A01, A02) recording tool + model; each runs every condition.
  planned: 2
  design: within-subjects
  counterbalanced: true # task-to-condition assignment randomized per repetition block

session:
  durationMinutes: 30 # per-run timebox enforced by the harness
  taskDescription: >-
    12 small Python tasks (bug fix / feature / refactor) across two
    researcher-owned repositories, each shipping harness acceptance tests
    (FR-INST-16). One session = one harness run of one agent participant on
    one task under one condition, timeboxed at 30 minutes; 5 repetition
    runs per (task, condition, agent) cell for run-to-run variance. The
    generated-context condition uses agent context files produced from the
    documents of record (FR-AGF-2) at a pinned generation version recorded
    in the environment snapshot. Task kit: study/context-ablation/tasks/
    (to be authored; design-phase gate).

instruments:
  # No cognitiveOverlay: there is no human in the loop (FR-PROT-9).
  agentCapture:
    adapter: claude-code
    contentPolicy: metadata-only
  taskHarness:
    runsPerCell: 5
    timeboxMinutes: 30
    record: [task_outcome, token_usage, tool_calls, wall_time]
  metrics:
    metricSet: cognitive-load-9
    target: agent-diff # profile the diff each run produces, not the whole repo

phases:
  - name: design
    gates:
      - protocol-validated.txt # satisfiable only once FR-PROT-9 lands
      - task-definitions.md
  - name: ethics
    gates:
      - data-handling-note.md # records the no-human-participants determination
  - name: pilot
    gates:
      - dry-run-report.md
  - name: data-collection
    gates:
      - dataset-export.sqlite3
      - integrity-report.md
  - name: analysis
    gates:
      - per-rq-report.md
  - name: write-up
    gates: []

analysisPlan:
  - rq: RQ-A1
    recipes: [task-outcome-by-condition, cost-effectiveness-frontier]
  - rq: RQ-A2
    recipes: [code-quality-by-condition]
  - rq: RQ-A3
    recipes: [agent-interaction-dynamics]

literature:
  - paperRef: "arxiv:2602.11988" # Gloaguen et al., Evaluating AGENTS.md
    justifies: [RQ-A1, RQ-A2]
  - paperRef: "arxiv:2601.20404" # Lulla et al., AGENTS.md efficiency effects
    justifies: [RQ-A1, RQ-A3]
  - paperRef: "arxiv:2509.09853" # Fan et al., SWE-Effi cost-aware agent metrics
    justifies: [RQ-A1]
  - paperRef: "arxiv:2407.01502" # Kapoor et al., AI Agents That Matter (cost reporting)
    justifies: [RQ-A1]
