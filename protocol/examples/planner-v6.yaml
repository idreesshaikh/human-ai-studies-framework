# Example configuration, not a study result. Fill in task materials and actual tool versions.
protocolVersion: 6
study:
  id: planner-example
  title: Versioned developer study planning example
  researchers:
  - Study researcher
researchQuestions:
- id: RQ-P1
  text: How does the recorded tool version affect completion time and participant
    experience?
conditions:
- tool-version-a
- tool-version-b
participants:
  planned: 40
  design: within-subjects
  counterbalanced: true
session:
  durationMinutes: 45
  taskDescription: Matched maintenance tasks under two recorded tool versions.
instruments:
  tern:
    session:
      durationMinutes: 45
    fatigue:
      intervalMinutes: 15
      waitForPauseSeconds: 4
      jitterPercent: 20
      quietTailMinutes: 5
    stuck:
      enabled: true
      thresholdSeconds: 90
      cooldownMinutes: 5
      languages:
      - python
    output:
      httpEndpoint: http://127.0.0.1:8000/ingest/events
    ideHealth:
      enabled: false
      debounceSeconds: 10
    comprehensionProbe:
      enabled: true
      cadence: every-chunk
      sampleRate: 1
      probeTypes:
      - predict-output
      - locate-change
  metrics:
    metricSet: cognitive-load-9
  agentCapture:
    adapter: claude-code
    contentPolicy: metadata-only
  surveys:
  - id: raw-tlx
    version: '1.0'
    title: Task workload
    timing: post-task
    instructions: Rate the task you just finished.
    items:
    - id: mental_demand
      text: How much mental and perceptual activity was required?
      scale:
        min: 0
        max: 100
        step: 10
        lowLabel: Low
        highLabel: High
      reverse: false
    - id: temporal_demand
      text: How much time pressure did you feel?
      scale:
        min: 0
        max: 100
        step: 10
        lowLabel: Low
        highLabel: High
      reverse: false
    - id: performance
      text: How successful do you think you were in accomplishing the goals of the task?
      scale:
        min: 0
        max: 100
        step: 10
        lowLabel: Poor
        highLabel: Good
      reverse: true
    - id: effort
      text: How hard did you have to work to accomplish your level of performance?
      scale:
        min: 0
        max: 100
        step: 10
        lowLabel: Low
        highLabel: High
      reverse: false
    - id: frustration
      text: How insecure, discouraged, irritated, stressed and annoyed did you feel during
        the task?
      scale:
        min: 0
        max: 100
        step: 10
        lowLabel: Low
        highLabel: High
      reverse: false
    scoring: mean
    source: https://ntrs.nasa.gov/citations/20000021488
    licence: US government work; NASA permits use and modification without permission
    validation: 'Adapted raw TLX: five of the six NASA v1.0 subscales (physical demand dropped
      for desk tasks), each question the first sentence of NASA''s definition, rated 0–100
      in steps of 10 (11 points; the paper form has 21). Performance runs Poor → Good and
      is reverse-scored, so the score is the unweighted mean with higher meaning more workload.
      Report it as an adapted raw TLX, not the weighted NASA-TLX.'
  - id: session-check
    version: '1.0'
    title: About this session
    timing: post-task
    instructions: There are no right answers. Please answer honestly.
    items:
    - id: ai_use
      text: How much did you use AI tools during the task (chat, code completion or agents,
        inside or outside the editor)?
      scale:
        min: 0
        max: 4
        step: 1
        lowLabel: Not at all
        highLabel: Throughout the task
      reverse: false
    - id: comprehension
      text: How well do you understand the code you ended up with?
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: Not at all
        highLabel: Completely
      reverse: false
    scoring: none
    source: StudyLoop item set, 2026-11-23
    licence: Repository MIT licence
    validation: 'Unvalidated single items, analysed separately. ai_use is asked in every
      condition: above 0 is reported AI use, and 0 is a self-report, not verified non-use.
      Interpret responses in the context of the study protocol and analyse by assigned condition.
      comprehension is a self-rating, not a comprehension test.'
  - id: sus
    version: '1.0'
    title: System Usability Scale
    timing: post-task
    items:
    - id: sus_1
      text: I think that I would like to use this system frequently
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: Strongly disagree
        highLabel: Strongly agree
      reverse: false
    - id: sus_2
      text: I found the system unnecessarily complex
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: Strongly disagree
        highLabel: Strongly agree
      reverse: true
    - id: sus_3
      text: I thought the system was easy to use
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: Strongly disagree
        highLabel: Strongly agree
      reverse: false
    - id: sus_4
      text: I think that I would need the support of a technical person to be able to use
        this system
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: Strongly disagree
        highLabel: Strongly agree
      reverse: true
    - id: sus_5
      text: I found the various functions in this system were well integrated
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: Strongly disagree
        highLabel: Strongly agree
      reverse: false
    - id: sus_6
      text: I thought there was too much inconsistency in this system
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: Strongly disagree
        highLabel: Strongly agree
      reverse: true
    - id: sus_7
      text: I would imagine that most people would learn to use this system very quickly
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: Strongly disagree
        highLabel: Strongly agree
      reverse: false
    - id: sus_8
      text: I found the system very cumbersome to use
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: Strongly disagree
        highLabel: Strongly agree
      reverse: true
    - id: sus_9
      text: I felt very confident using the system
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: Strongly disagree
        highLabel: Strongly agree
      reverse: false
    - id: sus_10
      text: I needed to learn a lot of things before I could get going with this system
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: Strongly disagree
        highLabel: Strongly agree
      reverse: true
    scoring: sus
    source: https://hci-studies.org/methods-and-measures/downloads/SUS_Brooke1996.pdf
    licence: © Digital Equipment Corporation 1986; freely available for usability assessment
      with acknowledgement of John Brooke (1996) in published reports
    validation: Original ten-item wording; reverse even items; sum contributions × 2.5 (0–100).
      Define the system being assessed in participant instructions.
  - id: pre-task-skill
    version: '1.0'
    title: Pre-task programming skill (experimental)
    timing: pre-task
    items:
    - id: experience
      text: How much experience do you have maintaining code in the language used in this
        study?
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: None
        highLabel: Extensive
      reverse: false
    - id: debugging
      text: How confident are you in diagnosing a failing test in an unfamiliar project?
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: Not confident
        highLabel: Very confident
      reverse: false
    - id: familiarity
      text: How familiar are you with the kind of task used in this study?
      scale:
        min: 1
        max: 5
        step: 1
        lowLabel: Unfamiliar
        highLabel: Very familiar
      reverse: false
    scoring: mean
    source: StudyLoop experimental item set, 2026-10-08
    licence: Repository MIT licence
    validation: 'Unvalidated draft: researcher must pilot before using as a skill covariate'
  taskHarness:
    enabled: true
phases:
- name: design
  gates:
  - protocol-validated.txt
  - task-definitions.md
- name: ethics
  gates:
  - ethics-approval.pdf
  - consent-form.pdf
- name: pilot
  gates:
  - dry-run-report.md
- name: recruitment
  gates:
  - participant-schedule.md
- name: data-collection
  gates:
  - dataset-export.sqlite3
  - integrity-report.md
- name: analysis
  gates:
  - per-rq-report.md
- name: write-up
  gates: []
analysisPlan:
- rq: RQ-P1
  recipes:
  - paired-nonparametric
  - typed-measures
  - control_arm_audit
tasks:
- id: task-a
  title: Maintenance task A
  description: Supply the task materials before recruitment.
  version: '1.0'
  contentHash: 4bcceec9759b7d976f50f00d9c4ccd8f2bf50762fced057bf69bc50cc9194eef
- id: task-b
  title: Maintenance task B
  description: Supply matched task materials before recruitment.
  version: '1.0'
  contentHash: 5c2006b8e0e9d4d398e079371b4c8534a9b843e2840dd7aea87580c4579ded40
measureSetVersion: '1.0'
measures:
- id: completion-time
  construct: Task completion time
  instrument: taskHarness
  fields:
  - task_outcome.firstGreenMs
  analysisRecipe: paired-nonparametric
  version: '1.0'
- id: raw-tlx-1
  construct: Raw TLX workload
  instrument: raw-tlx
  fields:
  - survey_response.score
  analysisRecipe: typed-measures
  version: '1.0'
- id: session-check-1
  construct: self-rated comprehension
  instrument: session-check
  fields:
  - survey_response.responses.comprehension
  analysisRecipe: typed-measures
  version: '1.0'
- id: session-check-2
  construct: self-reported AI use
  instrument: session-check
  fields:
  - survey_response.responses.ai_use
  analysisRecipe: typed-measures
  version: '1.0'
- id: sus-1
  construct: System Usability Scale
  instrument: sus
  fields:
  - survey_response.score
  analysisRecipe: typed-measures
  version: '1.0'
covariate:
  instrument: pre-task-skill
  field: pre_task_covariate.score
  timing: pre-task
toolVersions:
  tool-version-a:
    tool: copilot
    extensionId: GitHub.copilot
  tool-version-b:
    tool: copilot
    extensionId: GitHub.copilot
