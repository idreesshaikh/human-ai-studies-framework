[project]
name = "protocol"
version = "0.1.0"
description = "Study protocol schema, validation, capture configuration, and replication export"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
protocol = "protocol.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
