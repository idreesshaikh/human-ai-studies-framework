<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="StudyLoop supports research planning, cited design choices, versioned protocols, participant capture and reproducible analysis."
    />
    <!-- The browser's own chrome is part of the record too: each rendition
         hands the OS the ground it is actually painting. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eff3f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a1120" />
    <meta name="color-scheme" content="light dark" />
    <title>StudyLoop</title>
    <script>
      // Apply the theme before first paint so there's no flash. Always the
      // atlas in daylight unless the researcher has explicitly chosen the
      // light table (see theme.ts).
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("platform-theme") === "dark" ? "dark" : "light",
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
