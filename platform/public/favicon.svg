<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Phoenix">
  <!-- Phoenix, drawn as the constellation it is: wings spread, head up, one
       long tail. Stars are magnitude marks, the same notation the app uses
       for grounding strength, and exactly one star carries the accent.
       Geometry is kept in step with src/components/brand/PhoenixMark.tsx;
       the hex values are hardcoded because a browser tab cannot read CSS
       custom properties. Ground is the ink token, stars are the plate, and
       the lead star is the dark rendition's accent, which is the one that
       stays legible against ink.
       No double hyphens in this comment: they are invalid inside XML. -->
  <rect width="32" height="32" rx="7" fill="#0e1b2d"/>

  <!-- The tethers, under the stars. -->
  <g stroke="#9cafc7" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <line x1="16" y1="6.5" x2="16" y2="15.6"/>
    <line x1="16" y1="15.6" x2="16" y2="25.2"/>
    <line x1="4.8" y1="11.6" x2="10.6" y2="13.9"/>
    <line x1="10.6" y1="13.9" x2="16" y2="15.6"/>
    <line x1="16" y1="15.6" x2="21.4" y2="13.9"/>
    <line x1="21.4" y1="13.9" x2="27.2" y2="11.6"/>
  </g>

  <g fill="#ffffff">
    <circle cx="16" cy="6.5" r="1.9"/>
    <circle cx="4.8" cy="11.6" r="2.1"/>
    <circle cx="10.6" cy="13.9" r="1.5"/>
    <circle cx="21.4" cy="13.9" r="1.5"/>
    <circle cx="27.2" cy="11.6" r="2.1"/>
    <circle cx="16" cy="25.2" r="1.7"/>
  </g>

  <!-- The heart: the one bright star, and the only colour in the mark. -->
  <circle cx="16" cy="15.6" r="3.1" fill="#5ea3ff"/>
</svg>
