# Persistent facilitator VM deployment (FR-OPS-1b, D26): pulls the
# released image from GHCR instead of building, keeps the SQLite volume on
# the VM disk (one file is the backup strategy, D11), and fronts it with
# Caddy for automatic TLS on your domain.
#
# One-time VM setup and the release pipeline's usage: RUNBOOK §9.
#
#   IMAGE_TAG=v0.3.0 docker compose -f deploy/compose.prod.yml up -d
#
# Config via deploy/.env (gitignored): IMAGE_TAG, SITE_ADDRESS,
# MIDDLEWARE_AUTH (mandatory here - this instance may carry more than the
# seeded demo, FR-OPS-1, and must never silently fall back to "none"), plus
# whichever of MIDDLEWARE_TOKEN or the MIDDLEWARE_CLERK_* trio that mode
# needs - middleware/auth.py fails loudly at startup if the chosen mode is
# misconfigured (FR-OPS-5, D29), so nothing here re-derives that check.

services:
  middleware:
    image: ghcr.io/idreesshaikh/human-ai-studies-framework/middleware:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      MIDDLEWARE_AUTH: ${MIDDLEWARE_AUTH:?set MIDDLEWARE_AUTH=token or clerk in deploy/.env}
      MIDDLEWARE_TOKEN: ${MIDDLEWARE_TOKEN:-}
      MIDDLEWARE_CLERK_JWKS_URL: ${MIDDLEWARE_CLERK_JWKS_URL:-}
      MIDDLEWARE_CLERK_ISSUER: ${MIDDLEWARE_CLERK_ISSUER:-}
      MIDDLEWARE_CLERK_PUBLISHABLE_KEY: ${MIDDLEWARE_CLERK_PUBLISHABLE_KEY:-}
      # Optional providers (NFR-4: every one degrades gracefully when unset).
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MIDDLEWARE_S2_API_KEY: ${MIDDLEWARE_S2_API_KEY:-}
      MIDDLEWARE_GITHUB_TOKEN: ${MIDDLEWARE_GITHUB_TOKEN:-}
    volumes:
      - study-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env, e.g. studies.example.me}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  study-data:
  caddy-data:
  caddy-config: