[project]
name = "agent-capture"
version = "0.1.0"
description = "Optional provider transcript, snapshot, and task-harness producer"
requires-python = ">=3.12"
dependencies = [
    "protocol",
]

[project.scripts]
agent-capture = "agent_capture.cli:main"
agent-capture-hook = "agent_capture.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_capture"]

[tool.uv.sources]
protocol = { workspace = true }
