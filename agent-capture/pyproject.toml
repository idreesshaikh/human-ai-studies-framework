[project]
name = "agent-capture"
version = "0.1.0"
description = "Agent interaction leg: Claude Code hooks + transcript import, snapshots, task harness (FR-AGENT-*)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-capture = "agent_capture.cli:main"
agent-capture-hook = "agent_capture.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_capture"]
