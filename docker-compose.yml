# Local PostgreSQL stack. Add --profile sonar for optional SonarQube metrics.
# Named volumes preserve data across restarts; this configuration is not hardened
# for a public deployment. The Python CLI uses SQLite by default.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: middleware
      POSTGRES_USER: middleware
      POSTGRES_PASSWORD: middleware
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U middleware"]
      interval: 5s
      timeout: 3s
      retries: 12

  middleware:
    build:
      context: .
      dockerfile: middleware/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://middleware:middleware@postgres:5432/middleware
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_DESIGN_MODEL: ${MISTRAL_DESIGN_MODEL:-mistral-medium-latest}
    volumes:
      - study-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  demo-seed:
    environment:
      DATABASE_URL: postgres://middleware:middleware@postgres:5432/middleware
    build:
      context: .
      dockerfile: middleware/Dockerfile
    depends_on:
      middleware:
        condition: service_healthy
    command: >
      sh -c 'uv run python -m middleware demo-seed &&
      uv run python middleware/scripts/replay_session.py
      --server http://middleware:8000 --study-id demo-study'
    restart: "no"

  sonarqube:
    image: sonarqube:community
    profiles: ["sonar"]
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data

volumes:
  study-data:
  pg-data:
  sonar-data:
