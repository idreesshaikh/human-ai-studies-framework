# Local PostgreSQL stack. Add --profile sonar for optional SonarQube metrics.
# Named volumes preserve data across restarts; this configuration is not hardened
# for a public deployment. The Python CLI uses SQLite by default.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: middleware
      POSTGRES_USER: middleware
      POSTGRES_PASSWORD: middleware
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U middleware"]
      interval: 5s
      timeout: 3s
      retries: 12

  middleware:
    build:
      context: .
      dockerfile: middleware/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://middleware:middleware@postgres:5432/middleware
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_DESIGN_MODEL: ${LLM_DESIGN_MODEL:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-}
      LLM_STREAM_TIMEOUT_S: ${LLM_STREAM_TIMEOUT_S:-}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-}
      LLM_ALLOW_HTTP: ${LLM_ALLOW_HTTP:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-}
      MISTRAL_DESIGN_MODEL: ${MISTRAL_DESIGN_MODEL:-}
      MIDDLEWARE_AUTH: ${MIDDLEWARE_AUTH:-}
      MIDDLEWARE_TOKEN: ${MIDDLEWARE_TOKEN:-}
      MIDDLEWARE_CORS_ORIGINS: ${MIDDLEWARE_CORS_ORIGINS:-}
      MIDDLEWARE_PUBLIC_URL: ${MIDDLEWARE_PUBLIC_URL:-}
      MIDDLEWARE_S2_API_KEY: ${MIDDLEWARE_S2_API_KEY:-}
      S2_API_KEY: ${S2_API_KEY:-}
      MIDDLEWARE_REFRESH_INTERVAL_H: ${MIDDLEWARE_REFRESH_INTERVAL_H:-}
      MIDDLEWARE_REFRESH_QUERIES: ${MIDDLEWARE_REFRESH_QUERIES:-}
      MIDDLEWARE_CONTACT_EMAIL: ${MIDDLEWARE_CONTACT_EMAIL:-}
      MIDDLEWARE_CLERK_JWKS_URL: ${MIDDLEWARE_CLERK_JWKS_URL:-}
      MIDDLEWARE_CLERK_ISSUER: ${MIDDLEWARE_CLERK_ISSUER:-}
      MIDDLEWARE_CLERK_PUBLISHABLE_KEY: ${MIDDLEWARE_CLERK_PUBLISHABLE_KEY:-}
    volumes:
      - study-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  sonarqube:
    image: sonarqube:community
    profiles: ["sonar"]
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data

volumes:
  study-data:
  pg-data:
  sonar-data:
