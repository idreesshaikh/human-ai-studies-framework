<!-- Marketplace listing icon (converted to media/icon.png, which is what
     package.json points at — the Marketplace rejects SVG).

     Distinct from media/tern.svg: that one is the activity-bar glyph and must
     be monochrome `currentColor` strokes so VS Code can theme it. This one
     stands alone on a listing page, so it carries its own colour — the
     platform's signal blue on the dark observatory ground, matching
     galleryBanner. Same mark: four capture legs converging on one timeline. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="26" fill="#0e1420" />
  <g fill="none" stroke="#6ea8ff" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 94h72" stroke="#2b3a54" />
    <path d="M64 94V50" />
    <path d="M64 50 30 26" />
    <path d="M64 50l34-24" />
    <path d="M64 70 42 56" stroke="#4ec98a" />
    <path d="M64 70l22-14" stroke="#4ec98a" />
  </g>
</svg>
