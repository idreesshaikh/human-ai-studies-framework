<!-- Activity-bar icon. VS Code renders it monochrome from the stroke, so it
     is drawn as strokes only, on a 24×24 grid, and must read at 16px.

     A tern over a horizon: the bird the extension is named for, and the four
     capture legs as the four strokes converging on one timeline  -  the same
     "four legs, one timeline" idea the sidebar exists to show. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
     stroke-linejoin="round">
  <path d="M3 17.5h18" opacity="0.5" />
  <path d="M12 17.5V9" />
  <path d="M12 9 4.5 4.5" />
  <path d="M12 9l7.5-4.5" />
  <path d="M12 12.5 6.5 9.5" opacity="0.75" />
  <path d="M12 12.5l5.5-3" opacity="0.75" />
</svg>
