site_name: StudyLoop
site_description: Design, run and analyse human-AI developer studies with PHOENIX, the researcher web app, and TERN, the VS Code capture extension.
repo_url: https://github.com/idreesshaikh/human-ai-studies-framework
repo_name: idreesshaikh/human-ai-studies-framework
edit_uri: blob/main/documentation/docs/

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  icon:
    logo: studyloop/mark
    repo: fontawesome/brands/github
  # Archivo and Spline Sans Mono are served from assets/fonts, the same files
  # the app ships, so the site makes no font requests to third parties.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.sections
    - navigation.footer
    - toc.follow
    - content.code.annotate
    - content.code.copy
    - search.suggest
    - search.highlight
    - header.autohide

extra_css:
  - stylesheets/studyloop.css

validation:
  omitted_files: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - toc:
      permalink: true
      permalink_title: Link to this section
  - md_in_html
  - tables
  - footnotes
  - def_list

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/idreesshaikh/human-ai-studies-framework
  generator: false

copyright: Copyright &copy; 2026 Idrees Razak and Ole Becker. Released under the MIT License.

nav:
  - Home: index.md
  - PHOENIX:
    - platform/index.md
    - platform/quickstart.md
    - platform/design-conversation.md
    - platform/protocol-draft.md
    - platform/library.md
    - platform/planning.md
    - platform/participants.md
    - platform/data.md
  - TERN:
    - extension/index.md
    - extension/install.md
    - extension/using.md
    - extension/captured-data.md
    - extension/privacy.md
