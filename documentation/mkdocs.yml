  - Design a study:
    - The Setup tab: platform/index.md
    - Design conversation: platform/design-conversation.md
    - Templates: platform/templates.md
    - Enter the details directly: platform/manual-entry.md
    - Literature: platform/library.md
    - Review and apply the protocol: platform/protocol-draft.md
  - Plan:
    - Plan recruitment: platform/planning.md
    - Non-compliance sensitivity: platform/non-compliance.md
  - Run:
    - Participant links: platform/participants.md
    - Give participants TERN: platform/give-participants-tern.md
  - Data:
    - Review sessions and export: platform/data.md
    - Check outcome capture: platform/outcome-checks.md
    - Control-arm session review: platform/control-arm-review.md
  - TERN for participants:
    - About TERN: extension/index.md
    - Install and connect: extension/install.md
    - Run a session: extension/using.md
    - Captured data: extension/captured-data.md
